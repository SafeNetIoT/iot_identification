name: Test with Model Under Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  prepare-model:
    name: Prepare model artifact
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PROJECT_ROOT: ${{ github.workspace }}

    defaults:
      run:
        working-directory: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download model archive from GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RAW_BRANCH="${{ github.ref_name }}"
          SAFE_BRANCH=$(echo "$RAW_BRANCH" | sed 's|/|-|g')

          echo "Raw branch: $RAW_BRANCH"
          echo "Sanitized branch: $SAFE_BRANCH"

          MODEL_DIR="${{ runner.temp }}/model"
          mkdir -p "$MODEL_DIR"

          ASSET_NAME="model-${SAFE_BRANCH}.tar.gz"
          FALLBACK_ASSET="model-main.tar.gz"

          echo "Attempting to download branch-specific model: $ASSET_NAME"

          # Try branch-specific release
          set +e
          gh release download "$SAFE_BRANCH" \
            --pattern "$ASSET_NAME" \
            --dir "$MODEL_DIR"
          STATUS=$?
          set -e

          if [ $STATUS -ne 0 ]; then
            echo "Branch-specific model not found, falling back to main..."
            gh release download "main" \
              --pattern "$FALLBACK_ASSET" \
              --dir "$MODEL_DIR"
            ASSET_NAME="$FALLBACK_ASSET"
          fi

          echo "Extracting: $ASSET_NAME"
          tar -xzf "$MODEL_DIR/$ASSET_NAME" -C "$MODEL_DIR"

      - name: Stage model under test
        run: |
          echo "Staging extracted model files..."
          mkdir -p model_output
          cp -r ${{ runner.temp }}/model/* model_output/

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: model-under-test
          path: model_output

  test:
    name: Run tests with model
    runs-on: ubuntu-latest
    needs: prepare-model  # ensures model is ready before testing

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore dataset cache
        uses: actions/cache@v4
        with:
          path: data/raw
          key: dns-dataset-v5
          restore-keys: dns-dataset-v5

      - name: Restore session cache
        uses: actions/cache@v4
        with:
          path: session_cache/
          key: session-cache-v5
          restore-keys: session-cache-v5

      - name: Inspect session cache contents
        run: |
          echo "Contents of session_cache/:"
          ls -R session_cache/ || echo "session_cache/ missing or empty"
          echo "Disk usage:"
          du -sh session_cache/ || true

      - name: Fetch DNS dataset
        run: |
          bash scripts/raw_data.sh

      - name: Cache dataset
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/data/raw
          key: dns-dataset-v5

      - name: Download model artifact
        uses: actions/download-artifact@v4
        with:
          name: model-under-test
          path: ./artifacts

      - name: Run tests
        env:
          MODEL_PATH: ./artifacts
        run: |
          echo "Using model files from $MODEL_PATH"
          pytest -s

      - name: Save session cache
        if: always()
        uses: actions/cache@v4
        with:
          path: session_cache/
          key: session-cache-v5

      - name: Save dataset cache
        if: always()
        uses: actions/cache@v4
        with:
          path: data/raw
          key: dns-dataset-v5

      - name: Upload session cache (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: session-cache
          path: session_cache/