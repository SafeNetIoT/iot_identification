name: Test with Model Under Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  prepare-model:
    name: Prepare model artifact
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PROJECT_ROOT: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download model archive from GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ${{ runner.temp }}/model
          gh release download latest --pattern "*.tar.gz" --dir ${{ runner.temp }}/model
          echo "Extracting model archive..."
          tar -xzf ${{ runner.temp }}/model/*.tar.gz -C ${{ runner.temp }}/model

      - name: Stage model under test
        run: |
          echo "Staging extracted model files..."
          mkdir -p model_output
          cp -r ${{ runner.temp }}/model/* model_output/

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: model-under-test
          path: model_output

  test:
    name: Run tests with Docker Compose
    runs-on: ubuntu-latest
    needs: prepare-model

    steps:
      - uses: actions/checkout@v4

      - name: Download model artifact
        uses: actions/download-artifact@v4
        with:
          name: model-under-test
          path: ./artifacts

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (app)
        run: |
          docker compose build

      - name: Run tests in Docker Compose environment
        env:
          MODEL_PATH: ./artifacts
        run: |
          echo "Starting Docker Compose stack..."
          docker compose up --build --abort-on-container-exit
          docker compose down

      - name: Upload session cache (optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: session-cache
          path: session_cache/